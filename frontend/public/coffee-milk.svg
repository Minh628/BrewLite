  <ellipse cx="120" cy="188" rx="58" ry="10" fill="#FFFFFF"/>
  
  <!-- Quai ly -->
  <path d="M155 110 C185 110 185 155 155 155" stroke="#34241C" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Thân ly cà phê sữa -->
  <path d="M80 90 L88 175 C89 182 96 186 104 186 L136 186 C144 186 151 182 152 175 L160 90 Z" fill="#34241C"/>
  
  <!-- Các tầng lớp cà phê và sữa tươi đặc trưng của Cà phê sữa / Bạc xỉu -->
