  <ellipse cx="120" cy="188" rx="64" ry="10" fill="#FFFFFF"/>
  
  <!-- Quai ly cong tròn -->
  <path d="M158 115 C190 115 190 155 158 155" stroke="#C68A4C" stroke-width="8" stroke-linecap="round" fill="none"/>
  
  <!-- Tách Cappuccino miệng rộng -->
  <path d="M72 105 C75 165 95 186 120 186 C145 186 165 165 168 105 Z" fill="#FFFFFF" stroke="#E6DFD5" stroke-width="2"/>
  
  <!-- Cà phê Espresso nâu vàng bên dưới bọt sữa -->
  <ellipse cx="120" cy="106" rx="46" ry="14" fill="#6F432A"/>
  
