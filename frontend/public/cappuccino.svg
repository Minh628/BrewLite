  <circle cx="120" cy="91" r="1.5" fill="#C68A4C"/>
  
  <!-- Bột quế/cacao rắc nhẹ trang trí -->
  <circle cx="102" cy="104" r="1" fill="#7A4B2F" opacity="0.7"/>
  <circle cx="106" cy="100" r="1.2" fill="#7A4B2F" opacity="0.6"/>
  <circle cx="134" cy="101" r="1" fill="#7A4B2F" opacity="0.6"/>
  <circle cx="138" cy="105" r="1.3" fill="#7A4B2F" opacity="0.7"/>
  
  <!-- Làn khói hương thơm -->
  <path d="M110 80 C105 68 114 60 110 46" stroke="#C68A4C" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6"/>
  <path d="M126 76 C121 64 130 56 126 42" stroke="#C68A4C" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
