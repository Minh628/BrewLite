<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Nền hình tròn màu kem pastel mát mẻ -->
  <circle cx="120" cy="120" r="108" fill="#FFF9F5" stroke="#F0E3D7" stroke-width="3"/>
  <circle cx="120" cy="120" r="95" fill="#FFF1E8"/>
  
  <!-- Ly trà thủy tinh cao trong suốt -->
  <path d="M78 65 L90 185 C91 192 97 196 105 196 L135 196 C143 196 149 192 150 185 L162 65 Z" fill="#FFFFFF" opacity="0.4"/>
  <path d="M78 65 L90 185 C91 192 97 196 105 196 L135 196 C143 196 149 192 150 185 L162 65 Z" stroke="#E6A889" stroke-width="2.5"/>
  
  <!-- Nước trà đào màu cam hồng óng ánh -->
  <path d="M80 85 L90 184 C91 190 97 194 104 194 L136 194 C143 194 149 190 150 184 L160 85 Z" fill="#E88258"/>
  <!-- Hiệu ứng chuyển màu trà đào -->
  <path d="M84 130 L90 184 C91 190 97 194 104 194 L136 194 C143 194 149 190 150 184 L156 130 Z" fill="#F4A261" opacity="0.7"/>
  
  <!-- Miệng ly trà -->
  <ellipse cx="120" cy="65" rx="42" ry="11" fill="#FFFFFF" stroke="#E6A889" stroke-width="2"/>
  <ellipse cx="120" cy="65" rx="38" ry="9" fill="#FFF4ED"/>
  
  <!-- Miếng đào tươi vàng cam ngâm trong ly -->
  <path d="M96 100 C92 92 105 85 116 92 C124 98 116 112 106 112 C98 112 99 106 96 100 Z" fill="#FFB703" stroke="#FB8500" stroke-width="1.5"/>
  <path d="M112 135 C108 128 120 120 130 126 C138 131 132 144 122 144 C115 144 116 139 112 135 Z" fill="#FFB703" stroke="#FB8500" stroke-width="1.5"/>
  
  <!-- Viên đá lạnh trong suốt lấp lánh -->
  <rect x="110" y="78" width="22" height="22" rx="4" transform="rotate(15 110 78)" fill="#FFFFFF" opacity="0.7" stroke="#FFE3D6" stroke-width="1"/>
  <rect x="94" y="115" width="20" height="20" rx="4" transform="rotate(-12 94 115)" fill="#FFFFFF" opacity="0.6" stroke="#FFE3D6" stroke-width="1"/>
  <rect x="122" y="105" width="18" height="18" rx="4" transform="rotate(25 122 105)" fill="#FFFFFF" opacity="0.6" stroke="#FFE3D6" stroke-width="1"/>
  
  <!-- Lá bạc hà tươi xanh trang trí trên miệng ly -->
  <path d="M128 62 C138 52 148 56 146 68 C136 68 130 64 128 62 Z" fill="#588157"/>
  <path d="M125 64 C132 50 122 42 114 48 C116 58 122 62 125 64 Z" fill="#74A57F"/>
  
  <!-- Ống hút giấy thân thiện môi trường -->
  <rect x="135" y="28" width="6" height="85" rx="3" transform="rotate(18 135 28)" fill="#E76F51"/>
  <line x1="137" y1="30" x2="155" y2="85" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>

