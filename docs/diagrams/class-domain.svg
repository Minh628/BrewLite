@startuml
title Domain Class Diagram - BrewLite Core Architecture
skinparam classAttributeIconSize 0
skinparam classFontStyle bold
skinparam roundcorner 5
skinparam shadowing false

enum Role {
  CUSTOMER
  BARISTA
  ADMIN
}

enum Size {
  S
  M
  L
}

enum OrderStatus {
  PENDING
  PAID
  PAYMENT_FAILED
  PREPARING
  READY
  COMPLETED
  CANCELLED
}

enum PaymentMethod {
  WALLET
  CARD
}

enum PaymentStatus {
  SUCCEEDED
  FAILED
  REFUNDED
}

enum DiscountType {
  PERCENT
  FIXED
}

class User {
  +id: Int <<PK>>
  +email: String <<Unique>>
  +passwordHash: String
  +loyaltyPoints: Int
  +role: Role
  +createdAt: DateTime
  - -
  +register(dto: RegisterDto): User
  +validatePassword(plain: String): Boolean
  +addLoyaltyPoints(points: Int): Void
}

class Category {
  +id: Int <<PK>>
  +name: String <<Unique>>
  +isActive: Boolean
  +createdAt: DateTime
  +updatedAt: DateTime
}

class Product {
  +id: Int <<PK>>
  +categoryId: Int <<FK>>
  +name: String <<Unique>>
  +description: String?
  +price: Int
  +imageUrl: String?
  +stock: Int
  +version: Int
  +isActive: Boolean
  +createdAt: DateTime
  +updatedAt: DateTime
  - -
  +isAvailable(): Boolean
}

class ProductSize {
  +productId: Int <<PK, FK>>
  +size: String <<PK>>
  +extraPrice: Int
}

class Topping {
  +id: Int <<PK>>
  +name: String <<Unique>>
  +price: Int
  +isActive: Boolean
  +createdAt: DateTime
  +updatedAt: DateTime
}

class ProductTopping {
  +productId: Int <<PK, FK>>
  +toppingId: Int <<PK, FK>>
}

class Order {
  +id: Int <<PK>>
  +userId: Int <<FK>>
  +status: OrderStatus
  +total: Int
  +subtotal: Int
  +discount: Int
  +promoCode: String?
  +pointsEarned: Int
  +idempotencyKey: String? <<Unique per User>>
  +createdAt: DateTime
  +updatedAt: DateTime
  - -
  +calculateTotal(): Int
  +canTransitionTo(next: OrderStatus): Boolean
}

class OrderItem {
  +id: Int <<PK>>
  +orderId: Int <<FK>>
  +productId: Int <<FK>>
  +size: Size
  +qty: Int
  +unitPrice: Int
  +lineTotal: Int
}

class OrderItemTopping {
  +orderItemId: Int <<PK, FK>>
  +toppingId: Int <<PK, FK>>
  +price: Int
}

class Payment {
  +id: Int <<PK>>
  +idempotencyKey: String <<Unique>>
  +orderId: Int <<FK>>
  +amount: Int
  +method: String
  +status: PaymentStatus
  +requestHash: String
  +cardLast4: String?
  +failureReason: String?
  +createdAt: DateTime
}

class Promotion {
  +id: Int <<PK>>
  +code: String <<Unique>>
  +type: DiscountType
  +value: Int
  +minOrder: Int
  +maxDiscount: Int?
  +startsAt: DateTime
  +endsAt: DateTime
  +usageLimit: Int?
  +usedCount: Int
  +isActive: Boolean
  - -
  +isValidForOrder(orderTotal: Int): Boolean
  +computeDiscount(subtotal: Int): Int
}

Category "1" *- - "0..*" Product : phân loại
Product "1" *- - "1..*" ProductSize : có các size
Product "1" *- - "0..*" ProductTopping : cho phép topping
Topping "1" - - "0..*" ProductTopping : liên kết món
User "1" - - "0..*" Order : đặt hàng
Order "1" *- - "1..*" OrderItem : chứa các món
Product "1" - - "0..*" OrderItem : được đặt trong
OrderItem "1" *- - "0..*" OrderItemTopping : kèm topping
Topping "1" - - "0..*" OrderItemTopping : ghi nhận giá
Order "1" - - "0..*" Payment : thanh toán
Promotion "0..1" ..> Order : áp dụng giảm giá

User .up.> Role
Order .right.> OrderStatus
OrderItem .down.> Size
Payment .down.> PaymentStatus
Payment .down.> PaymentMethod
Promotion .down.> DiscountType
@enduml

